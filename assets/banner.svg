<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Muhammad Ahmad, Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a3a"/>
      <stop offset="1" stop-color="#0d3b4f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#2ee6c5"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#4f6bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#2ee6c5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2ee6c5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>
    <style>
      .t { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
      .rise { animation: rise .9s cubic-bezier(.23,1,.32,1) backwards; }
      .d1 { animation-delay: .05s } .d2 { animation-delay: .2s } .d3 { animation-delay: .35s } .d4 { animation-delay: .5s }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .rise { animation: none } .cursor { animation: none } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#glowA)"/>
    <rect width="1200" height="340" fill="url(#glowB)"/>

    <text class="t rise d1" x="72" y="112" font-size="15" font-weight="600" letter-spacing="4" fill="#9fb3ff">HELLO, I'M</text>
    <text class="t rise d2" x="72" y="184" font-size="68" font-weight="800" letter-spacing="-2" fill="#ffffff">Muhammad Ahmad</text>
    <rect class="rise d3" x="74" y="206" width="96" height="5" rx="2.5" fill="url(#accent)"/>
    <text class="t rise d3" x="72" y="252" font-size="25" font-weight="600" fill="url(#accent)">Full-Stack Software Developer</text>
    <text class="t rise d4" x="72" y="288" font-size="18" fill="#b8c2e0">MERN &amp; Next.js  ·  Backend architecture, APIs and polished frontends</text>

    <g class="rise d4" transform="translate(790 62)">
      <rect width="338" height="216" rx="16" fill="#0a1226" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="26" cy="26" r="6" fill="#ff5f57"/>
      <circle cx="46" cy="26" r="6" fill="#febc2e"/>
      <circle cx="66" cy="26" r="6" fill="#28c840"/>
      <text class="mono" x="26" y="74"  font-size="15" fill="#7c9cff">const</text>
      <text class="mono" x="78" y="74"  font-size="15" fill="#ffffff">developer</text>
      <text class="mono" x="168" y="74" font-size="15" fill="#8a96b8">=</text>
      <text class="mono" x="188" y="74" font-size="15" fill="#8a96b8">{</text>
      <text class="mono" x="46" y="104" font-size="15" fill="#2ee6c5">stack</text>
      <text class="mono" x="100" y="104" font-size="15" fill="#8a96b8">:</text>
      <text class="mono" x="114" y="104" font-size="15" fill="#f2c97d">"MERN + Next.js"</text>
      <text class="mono" x="46" y="134" font-size="15" fill="#2ee6c5">focus</text>
      <text class="mono" x="100" y="134" font-size="15" fill="#8a96b8">:</text>
      <text class="mono" x="114" y="134" font-size="15" fill="#f2c97d">"end-to-end"</text>
      <text class="mono" x="46" y="164" font-size="15" fill="#2ee6c5">from</text>
      <text class="mono" x="100" y="164" font-size="15" fill="#8a96b8">:</text>
      <text class="mono" x="114" y="164" font-size="15" fill="#f2c97d">"Pakistan"</text>
      <text class="mono" x="26" y="194" font-size="15" fill="#8a96b8">}</text>
      <rect class="cursor" x="42" y="180" width="9" height="18" fill="#2ee6c5"/>
    </g>
  </g>
</svg>
