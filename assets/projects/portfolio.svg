<style>
  .sans { font-family: Inter, -apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
  .in { }
  .d1 { animation-delay: .1s } .d2 { animation-delay: .25s } .d3 { animation-delay: .4s }
  .d4 { animation-delay: .55s } .d5 { animation-delay: .7s } .d6 { animation-delay: .85s }
  .d7 { animation-delay: 1s } .d8 { animation-delay: 1.15s }
  @keyframes in { from { opacity: 0 } to { opacity: 1 } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  .flow { stroke-dasharray: 6 10; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -32 } }
  @media (prefers-reduced-motion: reduce) { .in, .blink, .pulse, .flow { animation: none } }
